<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="is-grad-primary" x1="4" y1="8" x2="60" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="is-grad-accent" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Hexagonal intelligence shield / node base -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#is-grad-primary)" />
  
  <!-- Interlocking connection nodes symbolizing matching, career readiness & intelligence -->
  <!-- Left node (Student evidence) -->
  <circle cx="24" cy="32" r="6" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Right node (Opportunity demand) -->
  <circle cx="40" cy="32" r="6" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Synchronization Bridge -->
  <path d="M24 32C24 24 40 24 40 32C40 40 24 40 24 32Z" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Spark of Readiness -->
  <circle cx="32" cy="32" r="3" fill="#38BDF8" />
  <circle cx="32" cy="18" r="2.5" fill="url(#is-grad-accent)" />
  <circle cx="32" cy="46" r="2.5" fill="url(#is-grad-accent)" />
  
  <path d="M32 20.5V26M32 38V43.5" stroke="url(#is-grad-accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3" />
</svg>
